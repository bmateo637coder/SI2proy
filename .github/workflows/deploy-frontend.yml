name: Deploy Frontend (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**']

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Sustituir URL de API y WebSocket (URL de producción en build-time)
        shell: bash
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: |
          if [ -z "$PROD_API_URL" ]; then
            echo "::error::Variable PROD_API_URL no definida en GitHub (Settings > Variables)."
            exit 1
          fi
          WS_URL=$(echo "$PROD_API_URL" | sed -e 's#^https://#wss://#' -e 's#^http://#ws://#')
          FILES=$(grep -rlE "localhost:8000" src || true)
          echo "Archivos a sustituir: $(echo "$FILES" | wc -l)"
          for f in $FILES; do
            sed -i "s#http://localhost:8000#$PROD_API_URL#g; s#ws://localhost:8000#$WS_URL#g" "$f"
          done

      - name: Build Angular (base-href para Pages /SI2proy/)
        run: npx ng build --configuration production --base-href=/SI2proy/

      - name: Localizar carpeta de salida
        id: out
        run: echo "dir=$(find dist -type f -name index.html | head -1 | xargs dirname)" >> "$GITHUB_OUTPUT"

      - name: Deploy a GitHub Pages (rama gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/${{ steps.out.outputs.dir }}
          force_orphan: true