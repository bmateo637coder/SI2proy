name: Deploy Frontend (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**']

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Sustituir URL de API y WebSocket (URL de producción en build-time)
        shell: bash
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: |
          if [ -z "$PROD_API_URL" ]; then
            echo "::error::Variable PROD_API_URL no definida en GitHub (Settings > Variables)."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          api = os.environ['PROD_API_URL'].rstrip('/')
          parsed = urlsplit(api)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.query or parsed.fragment:
              raise SystemExit('PROD_API_URL debe ser una URL HTTPS sin query ni fragmento.')
          config = {'production': True, 'apiUrl': api, 'wsUrl': 'wss://' + api[len('https://'):],
                    'version': os.environ.get('GITHUB_SHA', 'parcial2')[:8]}
          Path('src/environments/environment.ts').write_text(
              'export const environment = ' + json.dumps(config) + ';\n', encoding='utf-8')
          PY

      - name: Build Angular (base-href para Pages /SI2proy/)
        run: npx ng build --configuration production --base-href=/SI2proy/

      - name: Preparar shell e instalación PWA
        run: node scripts/build-pwa.mjs

      - name: Localizar carpeta de salida
        id: out
        run: echo "dir=$(find dist -type f -name index.html | head -1 | xargs dirname)" >> "$GITHUB_OUTPUT"

      - name: Fallback SPA (404.html = index.html para refrescos en rutas)
        run: cp "${{ steps.out.outputs.dir }}/index.html" "${{ steps.out.outputs.dir }}/404.html"

      - name: Deploy a GitHub Pages (rama gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/${{ steps.out.outputs.dir }}
          force_orphan: true
