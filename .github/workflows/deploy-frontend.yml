name: Deploy Frontend (GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'inspect: revisar Render; deploy: actualizar backend y web; frontend: solo web'
        type: choice
        options: [inspect, deploy, frontend, validate-recovery, recover]
        default: deploy
  push:
    branches: [main]
    paths: ['frontend/**']

permissions:
  contents: write

concurrency:
  group: ${{ inputs.operation == 'inspect' && format('render-inspect-{0}', github.run_id) || 'production' }}
  cancel-in-progress: false

jobs:
  recover:
    if: inputs.operation == 'validate-recovery' || inputs.operation == 'recover'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restauracion_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg2-binary>=2.9,<3' 'cryptography>=43,<51'
      - name: Validar respaldo y recuperar únicamente en base nueva gratuita
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ inputs.operation == 'recover' && secrets.RENDER_API_KEY || '' }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          VALIDATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restauracion_test
          RECOVERY_OPERATION: ${{ inputs.operation == 'recover' && 'restore' || 'validate' }}
        run: python backend/scripts/recover_database.py "$RECOVERY_OPERATION"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.operation == 'recover'
        with:
          name: configuracion-anterior-cifrada
          path: database-before-recovery.fernet
          if-no-files-found: ignore
          retention-days: 7
  render:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'inspect' || inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar respaldo cifrado de auditoria
        run: pip install 'cryptography>=43,<51' 'psycopg2-binary>=2.9,<3'
      - name: Comprobar o actualizar el servicio existente de Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          DEPLOY_OPERATION: ${{ inputs.operation }}
        run: python backend/scripts/deploy_render.py "$DEPLOY_OPERATION"

      - name: Conservar respaldo cifrado de auditoria
        if: always() && inputs.operation == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-cifrada-pre-deploy
          path: audit-pre-deploy.fernet
          if-no-files-found: ignore
          retention-days: 7

  build-deploy:
    needs: render
    if: >-
      always() && !cancelled() && inputs.operation != 'inspect' && inputs.operation != 'recover' && inputs.operation != 'validate-recovery' &&
      (needs.render.result == 'success' || needs.render.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Verificar compatibilidad del backend antes de publicar
        working-directory: .
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: python3 backend/scripts/deploy_render.py verify

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Sustituir URL de API y WebSocket (URL de producción en build-time)
        shell: bash
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: |
          if [ -z "$PROD_API_URL" ]; then
            echo "::error::Variable PROD_API_URL no definida en GitHub (Settings > Variables)."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          api = os.environ['PROD_API_URL'].rstrip('/')
          parsed = urlsplit(api)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.query or parsed.fragment:
              raise SystemExit('PROD_API_URL debe ser una URL HTTPS sin query ni fragmento.')
          config = {'production': True, 'apiUrl': api, 'wsUrl': 'wss://' + api[len('https://'):],
                    'version': os.environ.get('GITHUB_SHA', 'parcial2')[:8]}
          Path('src/environments/environment.ts').write_text(
              'export const environment = ' + json.dumps(config) + ';\n', encoding='utf-8')
          PY

      - name: Build Angular (base-href para Pages /SI2proy/)
        run: npx ng build --configuration production --base-href=/SI2proy/

      - name: Preparar shell e instalación PWA
        run: node scripts/build-pwa.mjs

      - name: Localizar carpeta de salida
        id: out
        run: echo "dir=$(find dist -type f -name index.html | head -1 | xargs dirname)" >> "$GITHUB_OUTPUT"

      - name: Fallback SPA (404.html = index.html para refrescos en rutas)
        run: cp "${{ steps.out.outputs.dir }}/index.html" "${{ steps.out.outputs.dir }}/404.html"

      - name: Deploy a GitHub Pages (rama gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/${{ steps.out.outputs.dir }}
          force_orphan: true
