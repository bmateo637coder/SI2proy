databases:
  - name: raices-db
    plan: free
    databaseName: raices

services:
  - type: web
    name: raices-backend
    rootDir: backend
    runtime: python
    pythonVersion: 3.12.2
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raices-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BITACORA_FERNET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false