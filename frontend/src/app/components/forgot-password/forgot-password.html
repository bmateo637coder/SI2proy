<div class="login-container">
    <div class="luxury-card">
        <div class="logo-container">
            <h2>Recuperar Contraseña</h2>
            <p>Ingresa tu correo y te enviaremos las instrucciones</p>
        </div>
        
        <div *ngIf="mensaje" class="alert alert-success">
            {{ mensaje }}
        </div>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!enviado">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" formControlName="correo" class="form-control" placeholder="tu@correo.com">
                <small *ngIf="forgotForm.get('correo')?.invalid && forgotForm.get('correo')?.touched" class="text-danger">
                    Ingresa un correo válido.
                </small>
            </div>
            
            <button type="submit" class="btn-login" [disabled]="forgotForm.invalid">Enviar Enlace</button>
        </form>

        <div class="extra-links" style="margin-top: 20px; text-align: center;">
            <a routerLink="/login">← Volver al Inicio de Sesión</a>
        </div>
    </div>
</div>
