<div class="profile-container animate-fade-in p-6">
    <div class="luxury-card max-w-2xl mx-auto">
        <div class="card-header border-b border-gray-200 pb-4 mb-6">
            <h3 class="text-2xl font-bold text-gray-800">Seguridad de la Cuenta</h3>
            <p class="text-gray-500">Actualiza tu contraseña de acceso al sistema</p>
        </div>
        
        <div class="card-body">
            <div *ngIf="mensaje" class="alert p-4 mb-6 rounded-md" [ngClass]="{'bg-green-50 text-green-800 border border-green-200': !error, 'bg-red-50 text-red-800 border border-red-200': error}">
                {{ mensaje }}
            </div>

            <form [formGroup]="passwordForm" (ngSubmit)="cambiarPassword()">
                <div class="form-group mb-6">
                    <label for="nueva_password" class="block text-sm font-semibold text-gray-700 mb-2 uppercase tracking-wide">Nueva Contraseña</label>
                    <input type="password" id="nueva_password" formControlName="nueva_password" class="modern-input" placeholder="Escribe tu nueva contraseña">
                    <small *ngIf="passwordForm.get('nueva_password')?.hasError('required') && passwordForm.get('nueva_password')?.touched" class="text-red-500 mt-1 block">
                        La contraseña es obligatoria.
                    </small>
                    <small *ngIf="passwordForm.get('nueva_password')?.hasError('minlength') && passwordForm.get('nueva_password')?.touched" class="text-red-500 mt-1 block">
                        Debe tener al menos 8 caracteres.
                    </small>
                    <small *ngIf="passwordForm.get('nueva_password')?.hasError('pattern') && passwordForm.get('nueva_password')?.touched" class="text-red-500 mt-1 block">
                        Debe incluir al menos 1 mayúscula, 1 número y 1 carácter especial (@$!%*?&).
                    </small>
                </div>
                
                <div class="form-actions mt-8">
                    <button type="submit" class="btn-primary" [disabled]="passwordForm.invalid">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
